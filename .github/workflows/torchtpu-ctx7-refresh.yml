# This workflow refreshes the TorchTPU documentation on Context7 once a day.

name: Refresh TorchTPU on Context7

# Controls when the workflow will run
on:
  # Runs every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# This workflow has a single job that calls the Context7 refresh API
jobs:
  refresh:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Calls the Context7 refresh API.
      # Requires a repository secret named CONTEXT7_API_KEY (starts with "ctx7sk").
      # - 2xx: success
      # - 400 "too-early" (less than 10 days since last refresh): skipped, not a failure
      # - anything else (e.g. 401, 429, 5xx): fails the run and prints the response
      - name: Refresh Context7 library
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::error::CONTEXT7_API_KEY secret is empty or not set."
            exit 1
          fi

          resp=$(curl -sS -i -w '\n%{http_code}' -X POST https://context7.com/api/v1/refresh \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"libraryName": "/google-pytorch/torch_tpu"}')

          code=$(printf '%s\n' "$resp" | tail -n1)
          body=$(printf '%s\n' "$resp" | sed '$d')
          printf '%s\n' "$body"

          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Refresh requested successfully."
          elif [ "$code" = "400" ] && printf '%s' "$body" | grep -q '"too-early"'; then
            echo "::notice::Skipped: last refresh was less than 10 days ago."
          else
            echo "::error::Refresh failed with HTTP $code."
            exit 1
          fi
